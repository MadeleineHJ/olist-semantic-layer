name: 'olist_semantic_layer'
version: '1.0.0'
config-version: 2

# The profile name defined in profiles.yml
profile: 'olist'

# Paths
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Materialization defaults per layer
# Staging = views (cheap, always reflect source)
# Marts   = tables (fast for downstream BI queries)
models:
  olist_semantic_layer:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
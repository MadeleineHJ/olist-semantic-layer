version: 2

models:

  # ==========================================================================
  - name: stg_customers
    description: >
      Customer addresses cleaned and lightly normalized.
      Grain: one row per `customer_id` (per-order customer context).
      Downstream `dim_customers` collapses to `customer_unique_id` grain.
    columns:
      - name: customer_id
        description: Per-order customer identifier (NOT a person).
        tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Persistent person identifier. Use this for customer-level metrics.
        tests:
          - not_null
      - name: customer_state
        description: Two-letter Brazilian state code (uppercase).
        tests:
          - not_null
      - name: is_southeast_region
        description: True if customer is in SP, RJ, MG, or ES.

  # ==========================================================================
  - name: stg_orders
    description: >
      Orders with delivery-performance fields derived for downstream use.
      Grain: one row per order.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved']
      - name: is_delivered
        description: True when order_status = 'delivered'.
      - name: is_canceled
        description: True when order_status = 'canceled'.
      - name: delivery_days
        description: Days from purchase to customer receipt. NULL if not delivered.
      - name: is_on_time
        description: True if delivered on or before estimated date.
      - name: days_late
        description: Days past estimate when delivered late. 0 if on-time, NULL if not delivered.
      - name: delivery_status
        description: One of 'on_time', 'late', 'not_delivered'.
        tests:
          - not_null
          - accepted_values:
              values: ['on_time', 'late', 'not_delivered']

  # ==========================================================================
  - name: stg_order_items
    description: >
      Order line items. Grain: one row per item per order.
      WARNING: Do not join directly to stg_order_payments without
      aggregating first; row counts will multiply.
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: order_item_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_sellers')
              field: seller_id
      - name: price
        tests:
          - not_null
      - name: gross_item_value
        description: price + freight_value for this line item.

  # ==========================================================================
  - name: stg_order_payments
    description: >
      Payments at source grain (one row per payment method per order).
      An order can have multiple rows (split tender).
      Aggregation to one-per-order happens in marts.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_value
        tests:
          - not_null

  # ==========================================================================
  - name: stg_order_reviews
    description: >
      Reviews deduplicated to one row per order (most recent kept).
      Source had 99,224 rows for 98,673 distinct orders.
    columns:
      - name: review_id
        description: NOT unique even after dedup (raw data quirk -- 814 dup IDs).
        tests:
          - not_null
      - name: order_id
        tests:
          - unique          # this is the dedup guarantee
          - not_null
      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: has_comment
        description: True if review_comment_message is not null.

  # ==========================================================================
  - name: stg_products
    description: >
      Product catalog with English category names and missing categories
      coalesced to 'uncategorized'.
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: product_category
        description: English category name; 'uncategorized' for products with missing metadata.
        tests:
          - not_null

  # ==========================================================================
  - name: stg_sellers
    description: Seller addresses cleaned and lightly normalized.
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
      - name: seller_state
        tests:
          - not_null

  # ==========================================================================
  - name: stg_geolocation
    description: >
      Geolocation collapsed to one row per zip code prefix (centroid + modal city/state).
      Resolves the row-multiplication trap in the raw geolocation table.
    columns:
      - name: zip_code_prefix
        tests:
          - unique
          - not_null
      - name: latitude
        tests:
          - not_null
      - name: longitude
        tests:
          - not_null
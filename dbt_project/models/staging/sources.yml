version: 2

sources:
  - name: olist_raw
    description: >
      Raw Olist Brazilian e-commerce data loaded directly from the Kaggle CSVs.
      Lives in the `raw` schema of the DuckDB warehouse.
      See scripts/load_raw_data.py for the loading process.
    database: olist_warehouse
    schema: raw

    tables:

      - name: customers
        description: >
          Customer addresses keyed by `customer_id` (one row per order's customer
          context). Note the CRITICAL distinction: `customer_id` is per-order,
          `customer_unique_id` is the actual person.
        columns:
          - name: customer_id
            description: Per-order customer identifier. NOT a person ID.
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            description: Persistent identifier for the actual person.
            tests:
              - not_null
          - name: customer_zip_code_prefix
          - name: customer_city
          - name: customer_state

      - name: orders
        description: One row per order placed.
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: customer_id
            description: Joins to customers.customer_id (per-order grain).
            tests:
              - not_null
              - relationships:
                  to: source('olist_raw', 'customers')
                  field: customer_id
          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values:
                    [
                      'delivered',
                      'shipped',
                      'canceled',
                      'unavailable',
                      'invoiced',
                      'processing',
                      'created',
                      'approved',
                    ]
          - name: order_purchase_timestamp
            tests:
              - not_null

      - name: order_items
        description: >
          One row per item per order. An order with 3 items has 3 rows here.
          BE CAREFUL when joining to payments or you'll get Cartesian explosion.
        columns:
          - name: order_id
            tests:
              - not_null
              - relationships:
                  to: source('olist_raw', 'orders')
                  field: order_id
          - name: order_item_id
            description: Sequence number of the item within the order (1, 2, 3...).
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: seller_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null

      - name: order_payments
        description: One row per payment method used per order.
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_sequential
            tests:
              - not_null
          - name: payment_type
            tests:
              - accepted_values:
                  values:
                    ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']
                  config:
                    severity: warn
          - name: payment_value
            tests:
              - not_null

      - name: order_reviews
        description: >
          Customer reviews. Note `review_id` is NOT unique in the raw data
          (~814 duplicates). Most orders have 1 review but some have 2-3.
        columns:
          - name: review_id
            description: NOT unique in raw -- duplicates exist.
            tests:
              - not_null
          - name: order_id
            tests:
              - not_null
          - name: review_score
            tests:
              - not_null
              - accepted_values:
                  values: [1, 2, 3, 4, 5]

      - name: products
        description: Product catalog with category and physical dimensions.
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: sellers
        description: Seller addresses.
        columns:
          - name: seller_id
            tests:
              - unique
              - not_null

      - name: geolocation
        description: >
          Lat/lng per zip code prefix. Many rows per zip
          (~52 avg) -- aggregate before joining.
        columns:
          - name: geolocation_zip_code_prefix
            tests:
              - not_null

      - name: product_category_translation
        description: Portuguese -> English category name mapping.
        columns:
          - name: product_category_name
            tests:
              - unique
              - not_null